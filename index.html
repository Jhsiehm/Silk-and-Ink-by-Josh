<style>
/* Layout: one fixed canvas; scroll scrubs grain between three Song and Yuan paintings (the three distances) and the resume lines. Single deliberate charcoal-on-paper look. */
:root{
  --paper:#E4E0D5;
  --paper-deep:#D6D1C5;
  --charcoal:#262624;
  --charcoal-mid:#45443F;
  --graphite:#6B6C69;
  --ink-faint:#8D8A82;
  --font-latin:"Cormorant Garamond","EB Garamond",Garamond,"Times New Roman",serif;
  --font-han:"Noto Serif TC","Songti TC","PMingLiU",serif;
  color-scheme:light;
}
html{scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{
  background:var(--paper);
  color:var(--charcoal);
  font-family:var(--font-latin);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
  overscroll-behavior:none;
}
#ground{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(130% 100% at 50% 40%, transparent 45%, rgba(38,38,36,.13) 100%),
    linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
}
canvas#scroll{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block;touch-action:pan-y}
#grain{position:fixed;inset:0;z-index:2;pointer-events:none;mix-blend-mode:multiply;opacity:.6}
#spacer{position:relative;z-index:0}
.ui{position:fixed;z-index:3;font-family:var(--font-latin);color:var(--charcoal-mid)}
#lang{
  top:calc(18px + env(safe-area-inset-top,0px));
  right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));
  display:flex;gap:14px;align-items:baseline;
}
#lang button{
  appearance:none;border:0;background:none;padding:4px 0;cursor:pointer;
  font:500 15px/1 var(--font-latin);letter-spacing:.08em;color:var(--ink-faint);
  border-bottom:1px solid transparent;transition:color .4s,border-color .4s;
}
#lang button[data-l="zh"]{font-family:var(--font-han);font-size:14px;letter-spacing:.12em}
#lang button[aria-pressed="true"]{color:var(--charcoal);border-bottom-color:var(--graphite)}
#lang button:focus-visible{outline:1px solid var(--graphite);outline-offset:4px}
#hint,#end{
  left:max(22px,calc(env(safe-area-inset-left,0px) + 22px));
  bottom:calc(22px + env(safe-area-inset-bottom,0px));
}
#hint{font:italic 500 15px/1 var(--font-latin);letter-spacing:.14em;transition:opacity .8s}
#hint[data-l="zh"]{font-family:var(--font-han);font-style:normal;font-size:13px;letter-spacing:.3em}
#end{font:500 15px/1.4 var(--font-latin);letter-spacing:.06em;opacity:0;pointer-events:none}
#end a{color:var(--charcoal);text-decoration:none;border-bottom:1px solid var(--ink-faint)}
#end a:focus-visible{outline:1px solid var(--graphite);outline-offset:4px}
#plate{
  right:max(22px,calc(env(safe-area-inset-right,0px) + 22px));
  bottom:calc(22px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:flex-end;gap:12px;opacity:0;pointer-events:none;
  max-width:min(62vw,340px);
}
#credit{font:italic 600 13px/1.35 var(--font-latin);letter-spacing:.03em;color:var(--charcoal);text-align:right;text-shadow:0 0 6px var(--paper),0 0 12px var(--paper),0 0 2px var(--paper)}
#distance{text-shadow:0 0 6px var(--paper),0 0 12px var(--paper)}
#credit:lang(zh-Hant){font-family:var(--font-han);font-style:normal;font-size:12px;letter-spacing:.12em}
#distance{font:500 13px/1 var(--font-han);letter-spacing:.5em;color:var(--charcoal-mid);writing-mode:vertical-rl}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:520px){ #credit{font-size:12px} }
</style>

   credit:{en:"Fan Kuan, Travelers Among Mountains and Streams (detail)", zh:"范寬《谿山行旅圖》局部"}},
];
const S = SCENES.length;
const TONES = ["#262624", "#45443F", "#6B6C69"];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const hanAll = Object.values(COPY.zh).flat().join("") + "繁體高遠深平行旅" + MUSEUM.zh + SCENES.map(s=>s.credit?s.credit.zh:"").join("");
const hanChars = Array.from(new Set(hanAll)).join("");
const hl = document.createElement("link");
hl.rel = "stylesheet";
hl.href = "https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&display=swap&text=" + encodeURIComponent(hanChars);
document.head.appendChild(hl);

const cv = document.getElementById("scroll");
const ctx = cv.getContext("2d");
const ink = document.createElement("canvas");
const ictx = ink.getContext("2d");
const spacer = document.getElementById("spacer");
const hintEl = document.getElementById("hint");
const endEl = document.getElementById("end");
const plateEl = document.getElementById("plate");
const distEl = document.getElementById("distance");
const creditEl = document.getElementById("credit");
const srEl = document.getElementById("sr");

let W, H, DPR, N, segH, L;
let SX, SY, PH, LX, LY, DR, MG, OX, OY, VX, VY, FX, FY, FA, FM;
let P, Q;
let sets = {en: [], zh: []};
let washes = [];
let built = false;
const density = {};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr, rng){for(let i=arr.length-1;i>0;i--){const j=(rng()*(i+1))|0;const t=arr[i];arr[i]=arr[j];arr[j]=t}return arr}
const clamp01 = v => v<0?0:v>1?1:v;
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const smooth = (a,b,x) => {const t=clamp01((x-a)/(b-a));return t*t*(3-2*t)};

const KEYS = ["x","y","a","s","r","z","c"];
function newScene(){return {x:new Float32Array(N),y:new Float32Array(N),a:new Float32Array(N),s:new Float32Array(N),r:new Float32Array(N),z:new Float32Array(N),c:new Uint8Array(N)}}
function newBuf(){return {x:new Float32Array(N),y:new Float32Array(N),a:new Float32Array(N),s:new Float32Array(N),r:new Float32Array(N),c:new Uint8Array(N),m:new Float32Array(N)}}
function shuffleScene(sc, rng){
  const order = shuffle(Array.from({length:N},(_,i)=>i), rng);
  const t = newScene();
  for(let i=0;i<N;i++){const o=order[i];for(const k of KEYS)t[k][i]=sc[k][o]}
  for(const k of KEYS) sc[k]=t[k];
}

// ---------- Paintings as ink density ----------
function loadMaps(){
  return Promise.all(Object.entries(MAPS).map(([k,m]) => new Promise(res=>{
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = m.w; c.height = m.h;
      const g = c.getContext("2d"); g.drawImage(img,0,0);
      const px = g.getImageData(0,0,m.w,m.h).data, d = new Float32Array(m.w*m.h);
      for(let i=0;i<d.length;i++) d[i] = px[i*4]/255;
      // painted wash: the same brushwork in charcoal, soft and crisp
      const mk = (blur) => {
        const w = document.createElement("canvas"); w.width = m.w; w.height = m.h;
        const wg = w.getContext("2d"), id = wg.createImageData(m.w,m.h);
        for(let i=0;i<d.length;i++){ const o=i*4; id.data[o]=38; id.data[o+1]=38; id.data[o+2]=36; id.data[o+3]=Math.min(255, d[i]*330); }
        wg.putImageData(id,0,0);
        if(!blur) return w;
        const b = document.createElement("canvas"); b.width = m.w; b.height = m.h;
        const bg = b.getContext("2d"); bg.filter = `blur(${blur}px)`; bg.drawImage(w,0,0);
        return b;
      };
      density[k] = {w:m.w, h:m.h, d, crisp: mk(0), soft: mk(4)};
      res();
    };
    img.onerror = res;
    img.src = m.uri;
  })));
}
function placeArt(s, m){
  let sw, sh;
  if(s.fit==="h"){ sh = H*s.scale; sw = sh*m.w/m.h; if(sw > W*1.02){ sw = W*1.02; sh = sw*m.h/m.w; } }
  else { sw = W*s.scale; sh = sw*m.h/m.w; if(sh > H*1.02){ sh = H*1.02; sw = sh*m.w/m.h; } }
  let x0 = s.cx*W - sw/2;
  if(sw < W){ x0 = Math.max(Math.min(x0, W - sw*.97), -sw*.03); } else x0 = (W - sw)/2;
  return {x0, y0:(H - sh)/2, sw, sh};
}
function buildArt(s, k){
  const m = density[s.map];
  const rng = mulberry32(1000 + k*31);
  const sc = newScene();
  const pl = placeArt(s, m);
  s.pl = pl;
  if(!m){ for(let i=0;i<N;i++){ sc.x[i]=rng()*W; sc.y[i]=rng()*H; sc.a[i]=.05; sc.s[i]=1; sc.r[i]=1; sc.z[i]=.2; sc.c[i]=2; } return sc; }
  // importance-sample the brushwork: darker ink pulls more grain
  const n = m.d.length, cdf = new Float32Array(n);
  let acc = 0;
  for(let i=0;i<n;i++){ const v = m.d[i]; acc += v > .05 ? Math.pow(v, 1.45) : 0; cdf[i] = acc; }
  const ps = pl.sw/m.w, sizeK = Math.max(.75, Math.min(1.5, ps*.6));
  const dustN = Math.floor(N*.06);
  for(let i=0;i<N-dustN;i++){
    const u = rng()*acc;
    let lo = 0, hi = n-1;
    while(lo<hi){ const mid=(lo+hi)>>1; if(cdf[mid]<u) lo=mid+1; else hi=mid; }
    const ix = lo % m.w, iy = (lo / m.w)|0, v = m.d[lo];
    sc.x[i] = pl.x0 + (ix + rng())*ps;
    sc.y[i] = pl.y0 + (iy + rng())*pl.sh/m.h;
    sc.a[i] = Math.min(1, .34 + .95*Math.pow(v,.7));
    sc.s[i] = (.7 + v*1.1)*sizeK;
    sc.r[i] = 1 + rng()*.7;
    const yn = iy/m.h;
    sc.z[i] = clamp01(.12 + .88*Math.pow(yn,1.25)*(.55+.45*v));
    sc.c[i] = v > .45 ? 0 : v > .2 ? 1 : 2;
  }
  for(let i=N-dustN;i<N;i++){ sc.x[i]=rng()*W; sc.y[i]=rng()*H; sc.a[i]=.04+rng()*.06; sc.s[i]=.7+rng()*.5; sc.r[i]=1; sc.z[i]=.05; sc.c[i]=2; }
  shuffleScene(sc, rng);
  return sc;
}

// ---------- Text ----------
const off = document.createElement("canvas");
const og = off.getContext("2d", {willReadFrequently:true});
function wrap(g, text, maxW){
  const spaced = text.includes(" ");
  const units = spaced ? text.split(" ") : Array.from(text);
  const lines = []; let cur = "";
  for(const u of units){
    const test = cur ? cur + (spaced?" ":"") + u : u;
    if(g.measureText(test).width > maxW && cur){ lines.push(cur); cur = u; } else cur = test;
  }
  if(cur) lines.push(cur);
  return lines;
}
function sample(step){
  const d = og.getImageData(0,0,W,H).data, pts = [];
  for(let y=0;y<H;y+=step) for(let x=0;x<W;x+=step) if(d[(y*W+x)*4+3] > 110) pts.push(x, y);
  return pts;
}
function buildText(lines, lang, seed){
  const rng = mulberry32(seed*97 + (lang==="zh"?3:1));
  off.width = W; off.height = H;
  const fam = lang==="zh" ? '"Noto Serif TC","Cormorant Garamond",serif' : '"Cormorant Garamond",Garamond,serif';
  const gut = W<700 ? 24 : W*.11;
  const maxW = W - gut - 24;
  let ts = lang==="zh" ? Math.min(W*.072, H*.13, 92) : Math.min(W*.085, H*.15, 108);
  og.font = `600 ${ts}px ${fam}`;
  while(og.measureText(lines[0]).width > maxW && ts > 18){ ts *= .94; og.font = `600 ${ts}px ${fam}`; }
  const ss = Math.max(15, Math.min(W*.024, 26)) * (lang==="zh"?.95:1);
  og.font = `500 ${ss}px ${fam}`;
  const subLines = wrap(og, lines[1], Math.min(maxW, lang==="zh"? 520 : 600));
  const blockH = ts + ts*.55 + subLines.length*ss*1.5;
  const y0 = H*.42 - blockH/2 + ts*.8;

  og.clearRect(0,0,W,H); og.fillStyle = "#000";
  og.font = `600 ${ts}px ${fam}`; og.fillText(lines[0], gut, y0);
  const tStep = ts > 40 ? 2 : 1;
  const tp = sample(tStep);
  og.clearRect(0,0,W,H);
  og.font = `500 ${ss}px ${fam}`;
  subLines.forEach((s,k)=> og.fillText(s, gut+1, y0 + ts*.55 + ss*1.1 + k*ss*1.5));
  const sp = sample(1);

  const textN = Math.floor(N*.72);
  const tCount = tp.length/2, sCount = sp.length/2;
  let sB = Math.min(sCount, Math.floor(textN*.45));
  let tB = Math.min(tCount, textN - sB);
  sB = Math.min(sCount, textN - tB);

  const sc = newScene();
  let i = 0;
  const pick = (arr, cnt, step, alpha, size, tone) => {
    const n = arr.length/2, idx = shuffle(Array.from({length:n},(_,k)=>k), rng);
    for(let k=0;k<cnt;k++){
      const o = idx[k]*2;
      sc.x[i]=arr[o]+(rng()-.5)*step*.9; sc.y[i]=arr[o+1]+(rng()-.5)*step*.9;
      sc.a[i]=alpha*(.75+rng()*.25); sc.s[i]=size; sc.r[i]=1; sc.z[i]=0; sc.c[i]=tone; i++;
    }
  };
  pick(tp, tB, tStep, .94, 1.35, 0);
  pick(sp, sB, 1, .9, 1.0, 1);
  // leftover grain hangs in the paper like ink suspended in water
  for(;i<N;i++){
    const band = rng() < .55;
    sc.x[i]=rng()*W;
    sc.y[i]= band ? H*(.8 + Math.pow(rng(),.7)*.2) : rng()*H;
    sc.a[i]= band ? .05+rng()*.08 : .03+rng()*.06;
    sc.s[i]=.7+rng()*.7; sc.r[i]=1+rng()*.5; sc.z[i]=band?.15:.05; sc.c[i]=2;
  }
  shuffleScene(sc, rng);
  return sc;
}

// ---------- Camera: each distance has its own way of looking ----------
let mxs = 0, mys = 0;
function cam(scene, u){
  const amp = reduce ? 0 : 1;
  const o = {ax:W*.5, ay:H*.6, ds:0, dx:0, dy:0};
  if(scene.type==="art"){
    if(scene.cam==="high"){ o.dy = u*H*.11*amp; o.ds = -u*.025*amp; }
    else if(scene.cam==="deep"){ o.ds = u*.15*amp; o.ay = H*.55; }
    else { o.dx = -u*W*.08*amp; }
  }
  o.dx += -mxs*22*amp; o.dy += -mys*12*amp;
  return o;
}

// ---------- Build ----------
function build(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ink.width = Math.ceil(W/2); ink.height = Math.ceil(H/2);
  const newN = W < 700 ? 8000 : 16000;
  if(newN !== N || !SX){
    N = newN;
    const r = Math.random;
    SX=new Float32Array(N);SY=new Float32Array(N);PH=new Float32Array(N);
    LX=new Float32Array(N);LY=new Float32Array(N);DR=new Float32Array(N);MG=new Float32Array(N);
    OX=new Float32Array(N);OY=new Float32Array(N);VX=new Float32Array(N);VY=new Float32Array(N);
    FX=new Float32Array(N);FY=new Float32Array(N);FA=new Float32Array(N);FM=new Float32Array(N);
    P=newBuf(); Q=newBuf();
    for(let i=0;i<N;i++){
      PH[i]=r()*6.283; DR[i]=r(); MG[i]=.35+r()*.65;
      const ang = -Math.PI/2 + (r()-.3)*Math.PI*.95;
      LX[i]=Math.cos(ang); LY[i]=Math.sin(ang);
    }
  }
  for(let i=0;i<N;i++){ SX[i]=Math.random()*W; SY[i]=Math.random()*H; }
  L = reduce ? 0 : Math.min(W,H)*.2;
  segH = H*1.25;
  spacer.style.height = ((S-1)*segH + H) + "px";

  sets = {en:[], zh:[]}; washes = [];
  SCENES.forEach((s,k)=>{
    if(s.type==="art"){
      const sc = buildArt(s, k);
      sets.en[k]=sc; sets.zh[k]=sc;
      washes[k] = density[s.map] ? {m:density[s.map], pl:s.pl} : null;
    } else {
      sets.en[k] = buildText(COPY.en[s.key], "en", s.seed);
      sets.zh[k] = buildText(COPY.zh[s.key], "zh", s.seed);
      washes[k] = null;
    }
  });
  ictx.clearRect(0,0,ink.width,ink.height);
  built = true;
}

// ---------- State ----------
let lang = "en";
try { const v = localStorage.getItem("silk-lang"); if(v==="zh"||v==="en") lang = v; } catch(e){}
let langMix = lang==="zh" ? 1 : 0;
let sp = 0, start = 0, plateScene = -1;
let mx = -1e5, my = -1e5;

function setLang(l){
  lang = l;
  try{ localStorage.setItem("silk-lang", l); }catch(e){}
  document.getElementById("btn-en").setAttribute("aria-pressed", l==="en");
  document.getElementById("btn-zh").setAttribute("aria-pressed", l==="zh");
  hintEl.textContent = COPY[l].hint; hintEl.dataset.l = l;
  const c = COPY[l];
  srEl.lang = l==="zh" ? "zh-Hant" : "en";
  srEl.innerHTML = ["name","trade","state","honors"].map(k=>`<p>${c[k][0]}. ${c[k][1]}.</p>`).join("");
  plateScene = -1;
}
document.querySelectorAll("#lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));

addEventListener("pointermove", e=>{ mx=e.clientX; my=e.clientY; }, {passive:true});
document.addEventListener("pointerout", e=>{ if(!e.relatedTarget){ mx=my=-1e5; } });
let rt; addEventListener("resize", ()=>{ clearTimeout(rt); rt=setTimeout(build, 220); });

// a slow curling current, like ink let go in still water
function flowX(x,y,T){ const a = 2.3*(Math.sin(x*.0041 + y*.0013 + T*.22) + Math.cos(y*.0049 - x*.0018 - T*.17)); return Math.cos(a); }
function flowY(x,y,T){ const a = 2.3*(Math.sin(x*.0041 + y*.0013 + T*.22) + Math.cos(y*.0049 - x*.0018 - T*.17)); return Math.sin(a) - .45; }

function computeInto(set, k, t, out, cA, cB, T){
  const A = set[k], B = set[k+1];
  for(let i=0;i<N;i++){
    const za = A.z[i], zb = B.z[i];
    const ax = cA.ax + (A.x[i]-cA.ax)*(1+cA.ds*za) + cA.dx*za;
    const ay = cA.ay + (A.y[i]-cA.ay)*(1+cA.ds*za) + cA.dy*za;
    const bx = cB.ax + (B.x[i]-cB.ax)*(1+cB.ds*zb) + cB.dx*zb;
    const by = cB.ay + (B.y[i]-cB.ay)*(1+cB.ds*zb) + cB.dy*zb;
    const d = DR[i]*.55 + clamp01(B.x[i]/W)*.45;
    const lt = clamp01((t - d*.4)/.6), e = ease(lt), sn = Math.sin(Math.PI*lt);
    let x = ax + (bx-ax)*e, y = ay + (by-ay)*e;
    if(sn > .001){
      const lift = sn*L*MG[i];
      x += (flowX(x,y,T)*.65 + LX[i]*.35)*lift;
      y += (flowY(x,y,T)*.65 + LY[i]*.35)*lift;
    }
    out.x[i] = x; out.y[i] = y;
    out.a[i] = (A.a[i] + (B.a[i]-A.a[i])*e) * (1 - .25*sn);
    out.s[i] = A.s[i] + (B.s[i]-A.s[i])*e;
    out.r[i] = A.r[i] + (B.r[i]-A.r[i])*e;
    out.c[i] = e < .5 ? A.c[i] : B.c[i];
    out.m[i] = sn;
  }
}

let last = 0;
function frame(now){
  requestAnimationFrame(frame);
  if(!built) return;
  if(!start) start = now;
  const dt = Math.min(.05, (now - (last||now))/1000); last = now;
  const T = now/1000;

  const target = Math.min(S-1, scrollY/segH);
  sp = reduce ? target : sp + (target - sp)*Math.min(1, dt*3.6);
  let k = Math.floor(sp), f = sp - k;
  if(k >= S-1){ k = S-2; f = 1; }
  const t = smooth(.12, .88, f);

  const hasPtr = mx > -1e4;
  const tmx = hasPtr ? mx/W - .5 : 0, tmy = hasPtr ? my/H - .5 : 0;
  mxs += (tmx - mxs)*Math.min(1, dt*2.5); mys += (tmy - mys)*Math.min(1, dt*2.5);
  const cA = cam(SCENES[k], sp - k), cB = cam(SCENES[k+1], sp - (k+1));

  const introT = clamp01((now - start)/(reduce?600:4200));
  const lt = lang==="zh" ? 1 : 0;
  if(langMix !== lt){
    const step = dt/(reduce?.3:1.8);
    langMix = lt > langMix ? Math.min(lt, langMix+step) : Math.max(lt, langMix-step);
  }
  if(langMix <= 0 || langMix >= 1){
    computeInto(sets[langMix>=1?"zh":"en"], k, t, P, cA, cB, T);
  } else {
    computeInto(sets.en, k, t, P, cA, cB, T);
    computeInto(sets.zh, k, t, Q, cA, cB, T);
    for(let i=0;i<N;i++){
      const dx = Q.x[i]-P.x[i], dy = Q.y[i]-P.y[i];
      const ll = clamp01((langMix - DR[i]*.4)/.6), e = ease(ll);
      const sn = Math.sin(Math.PI*ll)*clamp01(Math.hypot(dx,dy)/40), lift = sn*L*.7*MG[i];
      const x = P.x[i] + dx*e, y = P.y[i] + dy*e;
      P.x[i] = x + (flowX(x,y,T)*.65 + LX[i]*.35)*lift;
      P.y[i] = y + (flowY(x,y,T)*.65 + LY[i]*.35)*lift;
      P.a[i] += (Q.a[i]-P.a[i])*e; P.s[i] += (Q.s[i]-P.s[i])*e; P.r[i] += (Q.r[i]-P.r[i])*e;
      if(e>.5) P.c[i] = Q.c[i];
      if(sn > P.m[i]) P.m[i] = sn;
    }
  }

  ctx.clearRect(0,0,W,H);
  const iE = ease(introT);

  // the painting itself, faint: a soft bloom first, the brushwork once the grain has settled
  const drawWash = (w, wt, c) => {
    if(!w || wt<=.002) return;
    const z = .55, sc = 1 + c.ds*z;
    const x = c.ax + (w.pl.x0 - c.ax)*sc + c.dx*z, y = c.ay + (w.pl.y0 - c.ay)*sc + c.dy*z;
    ctx.globalAlpha = Math.pow(wt*iE, 1.1)*.62;
    ctx.drawImage(w.m.soft, x, y, w.pl.sw*sc, w.pl.sh*sc);
    ctx.globalAlpha = Math.pow(wt*iE, 1.6)*.7;
    ctx.drawImage(w.m.crisp, x, y, w.pl.sw*sc, w.pl.sh*sc);
  };
  drawWash(washes[k], 1-t, cA); drawWash(washes[k+1], t, cB);

  const R = W<700 ? 70 : 110, R2 = R*R;
  for(let i=0;i<N;i++){
    let x = P.x[i], y = P.y[i], a = P.a[i], m = P.m[i];
    if(introT < 1){
      const il = clamp01((introT - DR[i]*.5)/.5), e = ease(il), sn = Math.sin(Math.PI*il), lift = sn*L*.55*MG[i];
      const bx = SX[i] + (x-SX[i])*e, by = SY[i] + (y-SY[i])*e;
      x = bx + (flowX(bx,by,T)*.7 + LX[i]*.3)*lift;
      y = by + (flowY(bx,by,T)*.7 + LY[i]*.3)*lift;
      a = .06 + (a-.06)*e;
      if(sn > m) m = sn;
      if(il < .02) m = 1;
    }
    if(!reduce){
      const amp = .3 + (1 - Math.min(1, a*2.5))*3.4;
      x += Math.sin(T*.4 + PH[i])*amp + flowX(x,y,T)*amp*.6;
      y += Math.cos(T*.29 + PH[i]*1.7)*amp*.7;
    }
    let vx = VX[i], vy = VY[i];
    if(hasPtr){
      const dx = x + OX[i] - mx, dy = y + OY[i] - my, d2 = dx*dx + dy*dy;
      if(d2 < R2 && d2 > .01){
        const d = Math.sqrt(d2), f2 = (1 - d/R), fs = f2*f2*(reduce?.6:1.5);
        vx += (dx/d)*fs + (-dy/d)*fs*.9 + .2*f2;
        vy += (dy/d)*fs + (dx/d)*fs*.9 - .4*f2;
      }
    }
    vx = (vx - OX[i]*.011)*.935; vy = (vy - OY[i]*.011)*.935;
    VX[i]=vx; VY[i]=vy; OX[i]+=vx; OY[i]+=vy;
    const disp = Math.abs(OX[i]) + Math.abs(OY[i]);
    if(disp > .5){ x += OX[i]; y += OY[i]; m = Math.max(m, Math.min(1, disp/45)); }
    FX[i]=x; FY[i]=y; FA[i]=a>1?1:a; FM[i]=m;
  }

  // ink in water: moving grain is laid into a half-resolution buffer that slowly clears, leaving soft plumes
  ictx.globalCompositeOperation = "destination-out";
  ictx.globalAlpha = 1; ictx.fillStyle = "rgba(0,0,0,.085)";
  ictx.fillRect(0,0,ink.width,ink.height);
  ictx.globalCompositeOperation = "source-over";
  ictx.fillStyle = "#34332F";
  for(let i=0;i<N;i++){
    const m = FM[i]; if(m < .04) continue;
    const a = FA[i]*m*.2; if(a < .004) continue;
    const s = P.s[i]*(1 + 2.6*m)*.5;
    ictx.globalAlpha = a*.7;
    ictx.fillRect(FX[i]*.5 - s*.5, FY[i]*.5 - s*.5, s, s);
  }
  ctx.globalAlpha = .8;
  ctx.drawImage(ink, 0, 0, W, H);

  for(let tone=0; tone<3; tone++){
    ctx.fillStyle = TONES[tone];
    for(let i=0;i<N;i++){
      if(P.c[i]!==tone) continue;
      const a = FA[i]*(1 - .6*FM[i]); if(a < .01) continue;
      ctx.globalAlpha = a;
      const s = P.s[i];
      ctx.fillRect(FX[i], FY[i], s, s*P.r[i]);
    }
  }
  ctx.globalAlpha = 1;

  hintEl.style.opacity = String(Math.max(0, 1 - sp*5) * iE);
  const endO = smooth(S-1.35, S-1.02, sp);
  endEl.style.opacity = String(endO);
  endEl.style.pointerEvents = endO > .5 ? "auto" : "none";
  const near = Math.min(S-1, Math.round(sp)), sc = SCENES[near];
  if(near !== plateScene){
    plateScene = near;
    if(sc.type==="art"){
      distEl.textContent = sc.label;
      creditEl.textContent = sc.credit[lang] + (lang==="zh" ? "　" : ". ") + MUSEUM[lang];
      creditEl.lang = lang==="zh" ? "zh-Hant" : "en";
    }
  }
  const pO = sc.type==="art" ? (1 - Math.min(1, Math.abs(sp-near)*3.2))*iE*(near===S-1 ? 1-endO*.0 : 1) : 0;
  plateEl.style.opacity = String(pO*.9);
}

function makeGrain(){
  const c = document.createElement("canvas"); c.width = c.height = 240;
  const g = c.getContext("2d"), img = g.createImageData(240,240), d = img.data;
  for(let i=0;i<d.length;i+=4){
    const v = 140 + Math.random()*115;
    d[i]=v; d[i+1]=v*.99; d[i+2]=v*.965; d[i+3]=Math.random()<.5 ? 30 : 12;
  }
  g.putImageData(img,0,0);
  g.lineWidth = .6;
  for(let k=0;k<30;k++){
    g.strokeStyle = `rgba(60,58,52,${.05+Math.random()*.08})`;
    const x=Math.random()*240, y=Math.random()*240, a=(Math.random()-.5)*.5;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*34, y+Math.sin(a)*34); g.stroke();
  }
  document.getElementById("grain").style.backgroundImage = `url(${c.toDataURL()})`;
}

setLang(lang);
makeGrain();
const fontsReady = Promise.all([
  document.fonts.load('600 60px "Cormorant Garamond"'),
  document.fonts.load('500 20px "Cormorant Garamond"'),
  document.fonts.load('600 60px "Noto Serif TC"', hanChars),
  document.fonts.load('500 20px "Noto Serif TC"', hanChars),
]).catch(()=>{});
Promise.all([
  Promise.race([fontsReady, new Promise(r=>setTimeout(r,2500))]),
  loadMaps()
]).then(()=>{
  build();
  requestAnimationFrame(frame);
});
})();
</script>
