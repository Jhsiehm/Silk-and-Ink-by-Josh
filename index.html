<style>
/* Layout: one fixed canvas; scroll scrubs grain between three Song and Yuan paintings (the three distances) and the resume lines. Single deliberate charcoal-on-paper look. */
:root{
  --paper:#E4E0D5;
  --paper-deep:#D6D1C5;
  --charcoal:#262624;
  --charcoal-mid:#45443F;
  --graphite:#6B6C69;
  --ink-faint:#8D8A82;
  --font-latin:"Cormorant Garamond","EB Garamond",Garamond,"Times New Roman",serif;
  --font-han:"Noto Serif TC","Songti TC","PMingLiU",serif;
  color-scheme:light;
}
html{scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{
  background:var(--paper);
  color:var(--charcoal);
  font-family:var(--font-latin);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
  overscroll-behavior:none;
}
#ground{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(130% 100% at 50% 40%, transparent 45%, rgba(38,38,36,.13) 100%),
    linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
}
canvas#scroll{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block;touch-action:pan-y}
#grain{position:fixed;inset:0;z-index:2;pointer-events:none;mix-blend-mode:multiply;opacity:.6}
#spacer{position:relative;z-index:0}
.ui{position:fixed;z-index:3;font-family:var(--font-latin);color:var(--charcoal-mid)}
#lang{
  top:calc(16px + env(safe-area-inset-top,0px));
  right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));
  display:flex;gap:12px;align-items:center;
}
#corner{position:absolute;pointer-events:none}
#lang button{
  appearance:none;border:0;background:none;padding:0;margin:0;cursor:pointer;
  position:relative;z-index:1;height:42px;color:transparent;font-size:1px;line-height:1;overflow:hidden;
}
#btn-sound{width:26px}
#btn-en{width:28px}
#btn-zh{width:42px}
#lang button:focus-visible{outline:1px solid var(--graphite);outline-offset:2px;border-radius:4px}
#lang button[aria-pressed="true"]{color:var(--charcoal);border-bottom-color:var(--graphite)}
#lang button:focus-visible{outline:1px solid var(--graphite);outline-offset:4px}
#hint{
  left:max(22px,calc(env(safe-area-inset-left,0px) + 22px));
  bottom:calc(22px + env(safe-area-inset-bottom,0px));
}
#hint{font:italic 500 15px/1 var(--font-latin);letter-spacing:.14em;transition:opacity .8s}
#hint[data-l="zh"]{font-family:var(--font-han);font-style:normal;font-size:13px;letter-spacing:.3em}
.hit{position:fixed;left:0;top:0;width:100px;height:128px;border-radius:14px;z-index:3;pointer-events:none;outline:none}
.hit:focus-visible{outline:1px solid var(--graphite);outline-offset:2px}
#plate{
  right:max(22px,calc(env(safe-area-inset-right,0px) + 22px));
  bottom:calc(22px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:flex-end;gap:12px;opacity:0;pointer-events:none;
  max-width:min(62vw,340px);
}
#credit{font:italic 600 13px/1.35 var(--font-latin);letter-spacing:.03em;color:var(--charcoal);text-align:right;text-shadow:0 0 6px var(--paper),0 0 12px var(--paper),0 0 2px var(--paper)}
#distance{text-shadow:0 0 6px var(--paper),0 0 12px var(--paper)}
#credit:lang(zh-Hant){font-family:var(--font-han);font-style:normal;font-size:12px;letter-spacing:.12em}
#distance{font:500 13px/1 var(--font-han);letter-spacing:.5em;color:var(--charcoal-mid);writing-mode:vertical-rl}
#uigrain{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;display:block}
#hint,#plate{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:520px){ #credit{font-size:12px} }

/* Reading: a quiet page of credentials under one living scene, opened from the pavilion */
#lang{z-index:5}
#btn-read{width:30px}
canvas#scroll,#uigrain{transition:opacity .9s ease}
html.reading{overflow:hidden}
html.reading canvas#scroll,html.reading #uigrain{opacity:0}
#read{
  position:fixed;inset:0;z-index:4;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  visibility:hidden;opacity:0;transition:opacity .8s ease,visibility 0s linear .8s;outline:none;
}
#read.on{visibility:visible;opacity:1;transition:opacity .9s ease .25s}
/* text scrolling up under the corner buttons fades into a band of paper, like mist */
#read::before{content:"";position:fixed;left:0;right:0;top:0;height:calc(74px + env(safe-area-inset-top,0px));z-index:2;pointer-events:none;
  background:var(--tex-paper,none) 0 0/320px 320px,var(--paper);
  -webkit-mask-image:linear-gradient(#000 52%,transparent);mask-image:linear-gradient(#000 52%,transparent)}
/* the paper behind the page carries a little grain: fine speckle and the odd fibre, nothing more */
#read{overflow-x:hidden;background-image:var(--tex-paper,none);background-size:320px 320px}
#read{--k:1;--ks:1}
#read .col{position:relative;z-index:1;max-width:680px;margin:0 auto;
  padding:calc(clamp(58px,9.5vh,104px)*var(--k) + env(safe-area-inset-top,0px)) 22px calc(clamp(20px,4vh,44px)*var(--k) + env(safe-area-inset-bottom,0px))}
.r-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:2px 18px;margin:0 0 calc(10px*var(--k))}
#r-name{font:italic 500 calc(clamp(32px,5.4vh,46px)*var(--k))/1.08 var(--font-latin);margin:0;color:var(--charcoal);letter-spacing:.003em}
#r-scene{display:block;width:calc(100%*var(--ks));aspect-ratio:2.5/1;height:auto;margin:0 auto calc(16px*var(--k));
  -webkit-mask-image:radial-gradient(ellipse 76% 74% at 50% 52%,#000 56%,transparent 100%);
  mask-image:radial-gradient(ellipse 76% 74% at 50% 52%,#000 56%,transparent 100%)}
#r-body p{font:500 calc(clamp(16px,2.35vh,19.5px)*var(--k))/1.5 var(--font-latin);color:var(--charcoal);margin:0 0 .6em}
#r-body .coda{font-style:italic;color:var(--charcoal-mid);margin-top:.85em}
#read a{color:var(--charcoal);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em;text-decoration-color:rgba(38,38,36,.5);
  transition:text-shadow .5s ease,text-decoration-color .5s ease;border-radius:2px}
/* a link darkens and bleeds a little, like ink touching damp paper */
#read a:hover,#read a:focus-visible{text-decoration-color:var(--charcoal);text-shadow:0 0 .6px rgba(38,38,36,.75),0 0 8px rgba(38,38,36,.22);outline:none}
#r-links{margin-top:calc(10px*var(--k));display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px clamp(12px,3vw,28px)}
.r-icons{display:flex;align-items:flex-end;gap:clamp(6px,2.2vw,20px);margin-left:-8px}
#read a.r-ic{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:2px 8px}
.r-ic canvas{display:block;width:calc(clamp(56px,9.5vh,92px)*var(--k));height:calc(clamp(36px,6.2vh,60px)*var(--k))}
.r-ic span{font:italic 500 calc(14.5px*var(--k))/1.2 var(--font-latin);letter-spacing:.07em;color:var(--charcoal-mid);
  text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.22em;text-decoration-color:rgba(38,38,36,.3)}
#read a.r-ic:hover span,#read a.r-ic:focus-visible span{color:var(--charcoal);text-decoration-color:var(--charcoal)}
#read a.r-mail{font:italic 500 calc(clamp(15.5px,2.2vh,18.5px)*var(--k))/1.4 var(--font-latin);letter-spacing:.02em;margin-bottom:3px}
#read[data-l="zh"] .r-ic span{font:500 calc(13.5px*var(--k))/1.2 var(--font-han);letter-spacing:.12em}
#read[data-l="zh"] #r-body .coda{font-style:normal}
#r-back{appearance:none;border:0;background:none;padding:4px 0;margin:0;font:italic 500 15px var(--font-latin);letter-spacing:.06em;color:var(--graphite);cursor:pointer}
#r-back:hover,#r-back:focus-visible{color:var(--charcoal);outline:none;text-shadow:0 0 7px rgba(38,38,36,.2)}
#read[data-l="zh"] #r-name{font:600 calc(clamp(28px,4.8vh,40px)*var(--k))/1.2 var(--font-han);letter-spacing:.14em}
#read[data-l="zh"] #r-body p{font-family:var(--font-han);font-size:calc(clamp(15px,2.15vh,17.5px)*var(--k));line-height:1.85;letter-spacing:.05em}
#read[data-l="zh"] #r-back{font:500 13.5px var(--font-han);letter-spacing:.3em}
@media (max-width:560px){
  #read .col{padding-top:calc(66px*var(--k) + env(safe-area-inset-top,0px))}
  #r-scene{margin-bottom:calc(12px*var(--k))}
}
/* each line settles in like ink finding the paper */
#read.on .ink{animation:inkIn 1.5s cubic-bezier(.2,.7,.2,1) both}
@keyframes inkIn{from{opacity:0;filter:blur(6px);transform:translateY(7px)}to{opacity:1;filter:blur(0);transform:none}}
@media (prefers-reduced-motion:reduce){ #read.on .ink{animation:none} #read,#read.on{transition:none} }
</style>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr, rng){for(let i=arr.length-1;i>0;i--){const j=(rng()*(i+1))|0;const t=arr[i];arr[i]=arr[j];arr[j]=t}return arr}
const clamp01 = v => v<0?0:v>1?1:v;
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const smooth = (a,b,x) => {const t=clamp01((x-a)/(b-a));return t*t*(3-2*t)};

const KEYS = ["x","y","a","s","r","z","c"];
function newScene(){return {x:new Float32Array(N),y:new Float32Array(N),a:new Float32Array(N),s:new Float32Array(N),r:new Float32Array(N),z:new Float32Array(N),c:new Uint8Array(N)}}
function newBuf(){return {x:new Float32Array(N),y:new Float32Array(N),a:new Float32Array(N),s:new Float32Array(N),r:new Float32Array(N),c:new Uint8Array(N),m:new Float32Array(N),z:new Float32Array(N)}}
function shuffleScene(sc, rng){
  const order = shuffle(Array.from({length:N},(_,i)=>i), rng);
  const t = newScene(), keys = sc.d ? KEYS.concat(["d"]) : KEYS;
  if(sc.d) t.d = new Float32Array(N);
  for(let i=0;i<N;i++){const o=order[i];for(const k of keys)t[k][i]=sc[k][o]}
  for(const k of keys) sc[k]=t[k];
}

// ---------- Paintings as ink density ----------
function loadMaps(){
  return Promise.all(Object.entries(MAPS).map(([k,m]) => new Promise(res=>{
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = m.w; c.height = m.h;
      const g = c.getContext("2d"); g.drawImage(img,0,0);
      const px = g.getImageData(0,0,m.w,m.h).data, d = new Float32Array(m.w*m.h);
      for(let i=0;i<d.length;i++) d[i] = px[i*4]/255;
      // painted wash: the same brushwork in charcoal, soft and crisp
      const mk = (blur) => {
        const w = document.createElement("canvas"); w.width = m.w; w.height = m.h;
        const wg = w.getContext("2d"), id = wg.createImageData(m.w,m.h);
        for(let i=0;i<d.length;i++){ const o=i*4; id.data[o]=38; id.data[o+1]=38; id.data[o+2]=36; id.data[o+3]=Math.min(255, d[i]*330); }
        wg.putImageData(id,0,0);
        if(!blur) return w;
        const b = document.createElement("canvas"); b.width = m.w; b.height = m.h;
        const bg = b.getContext("2d"); bg.filter = `blur(${blur}px)`; bg.drawImage(w,0,0);
        return b;
      };
      density[k] = {w:m.w, h:m.h, d, crisp: mk(0), soft: mk(4)};
      res();
    };
    img.onerror = res;
    img.src = m.uri;
  })));
}
function placeArt(s, m){
  let sw, sh;
  if(s.fit==="h"){ sh = H*s.scale; sw = sh*m.w/m.h; if(sw > W*1.02){ sw = W*1.02; sh = sw*m.h/m.w; } }
  else { sw = W*s.scale; sh = sw*m.h/m.w; if(sh > H*1.02){ sh = H*1.02; sw = sh*m.w/m.h; } }
  const placeX = () => { let x = s.cx*W - sw/2; return sw < W ? Math.max(Math.min(x, W - sw*.97), -sw*.03) : (W - sw)/2; };
  let x0 = placeX(), y0 = (H - sh)/2;
  const need = Math.min(W*.62, 340) + 44;
  const leftFree = x0, rightFree = W - (x0 + sw);
  let side, free = 0;
  if(rightFree >= need){ side = "right"; free = rightFree; }
  else if(leftFree >= need){ side = "left"; free = leftFree; }
  else {
    // no empty side: leave a clean strip of paper along the bottom for the inscription
    side = "band";
    const band = W < 700 ? 108 : 86, maxH = H - band - 8;
    if(y0 + sh > H - band){
      if(sh > maxH){ const k = maxH/sh; sh *= k; sw *= k; x0 = placeX(); }
      y0 = Math.max(6, (maxH - sh)/2 + 4);
    }
  }
  return {x0, y0, sw, sh, side, free};
}
function buildArt(s, k){
  const m = density[s.map];
  const rng = mulberry32(1000 + k*31);
  const sc = newScene();
  const pl = placeArt(s, m);
  s.pl = pl;
  if(!m){ for(let i=0;i<N;i++){ sc.x[i]=rng()*W; sc.y[i]=rng()*H; sc.a[i]=.05; sc.s[i]=1; sc.r[i]=1; sc.z[i]=.2; sc.c[i]=2; } return sc; }
  // importance-sample the brushwork: darker ink pulls more grain
  const n = m.d.length, cdf = new Float32Array(n);
  let acc = 0;
  for(let i=0;i<n;i++){ const v = m.d[i]; acc += v > .05 ? Math.pow(v, 1.45) : 0; cdf[i] = acc; }
  const ps = pl.sw/m.w, sizeK = Math.max(.75, Math.min(1.5, ps*.6));
  const dustN = Math.floor(N*.06);
  for(let i=0;i<N-dustN;i++){
    const u = rng()*acc;
    let lo = 0, hi = n-1;
    while(lo<hi){ const mid=(lo+hi)>>1; if(cdf[mid]<u) lo=mid+1; else hi=mid; }
    const ix = lo % m.w, iy = (lo / m.w)|0, v = m.d[lo];
    sc.x[i] = pl.x0 + (ix + rng())*ps;
    sc.y[i] = pl.y0 + (iy + rng())*pl.sh/m.h;
    sc.a[i] = Math.min(1, .34 + .95*Math.pow(v,.7));
    sc.s[i] = (.7 + v*1.1)*sizeK;
    sc.r[i] = 1 + rng()*.7;
    const yn = iy/m.h;
    sc.z[i] = clamp01(.12 + .88*Math.pow(yn,1.25)*(.55+.45*v));
    sc.c[i] = v > .45 ? 0 : v > .2 ? 1 : 2;
  }
  for(let i=N-dustN;i<N;i++){ sc.x[i]=rng()*W; sc.y[i]=rng()*H; sc.a[i]=.04+rng()*.06; sc.s[i]=.7+rng()*.5; sc.r[i]=1; sc.z[i]=.05; sc.c[i]=2; }
  shuffleScene(sc, rng);
  return sc;
}

// ---------- The river: a fisherman drifting on ink let go in water ----------
function riverY(x, T){
  const A = Math.min(H, W*.9);   // a tall phone gets a gentler swell, so the boat doesn't pitch
  return Math.sin(x*.0058 - T*.42 + .6)*A*.032 + Math.sin(x*.0139 - T*.77 + 2.1)*A*.013;
}
// the current is smooth, so the river reads it from a coarse grid made once a frame instead of per grain
let FG = null;
function buildFlowGrid(T){
  const cs = 36, cols = Math.ceil(W*1.3/cs) + 2, rows = Math.ceil(H*1.2/cs) + 2;
  if(!FG || FG.cols !== cols || FG.rows !== rows) FG = {cs, cols, rows, vx:new Float32Array(cols*rows), vy:new Float32Array(cols*rows)};
  FG.x0 = -W*.15; FG.y0 = -H*.1;
  for(let r=0, q=0; r<rows; r++) for(let c=0; c<cols; c++, q++){ flow(FG.x0 + c*cs, FG.y0 + r*cs, T); FG.vx[q] = FVX; FG.vy[q] = FVY; }
}
function flowS(x, y){
  const g = FG;
  let fx = (x - g.x0)/g.cs, fy = (y - g.y0)/g.cs;
  fx = fx < 0 ? 0 : fx > g.cols - 1.001 ? g.cols - 1.001 : fx;
  fy = fy < 0 ? 0 : fy > g.rows - 1.001 ? g.rows - 1.001 : fy;
  const c = fx|0, r = fy|0, ax = fx - c, ay = fy - r, q = r*g.cols + c, q2 = q + g.cols;
  FVX = (g.vx[q]*(1-ax) + g.vx[q+1]*ax)*(1-ay) + (g.vx[q2]*(1-ax) + g.vx[q2+1]*ax)*ay;
  FVY = (g.vy[q]*(1-ax) + g.vy[q+1]*ax)*(1-ay) + (g.vy[q2]*(1-ax) + g.vy[q2+1]*ax)*ay;
}
function buildRiver(s, k){
  const rng = mulberry32(777 + k*13);
  const sc = newScene();
  const m = density.icon_fisher;
  const boatN = m ? Math.floor(N*.16) : 0, ripN = Math.floor(N*.045), plumeN = Math.floor(N*.2), dustN = Math.floor(N*.02);
  const riverN = N - boatN - ripN - plumeN - dustN;
  const bw = Math.min(W*.84, W < 700 ? 330 : 500), ps = m ? bw/m.w : 1;
  const F = () => new Float32Array(N);
  const R = sc.river = {
    kind: new Uint8Array(N), cyc: new Int32Array(N), snap: new Uint8Array(N),
    p: F(), q: F(), v: F(), w: F(), f: F(), e: F(), a0: F(), ink: F(),
    cx: W*.5, cy: H*.52, bw, bh: m ? bw*m.h/m.w : 0

  const NS = 9, band = H*.15;
  let i = 0;
  // the current: grain carried along in tendrils, quicker and darker down the middle, paler toward the banks
  for(let j=0;j<riverN;j++,i++){
    const st = (rng()*NS)|0, b = (st/(NS-1))*2 - 1, mid = 1 - Math.abs(b);
    R.kind[i] = 0; R.p[i] = rng();
    R.q[i] = b*band + (rng()+rng()+rng()-1.5)*H*.014;
    R.v[i] = (34 + mid*52 + rng()*16)/(W*1.25);
    R.w[i] = rng()*2 - 1; R.f[i] = .55 + mid*.55 + rng()*.2;
    R.e[i] = H*(.008 + .02*rng()*(.5 + mid*.5));
    const a = (.16 + .5*Math.pow(rng(), 1.4))*(.6 + .6*mid);
    R.a0[i] = a; R.ink[i] = .4 + .45*rng()*(.4 + .6*mid);
    sc.a[i] = a; sc.s[i] = .55 + rng()*.6; sc.r[i] = 1; sc.z[i] = .28;
    sc.c[i] = a > .38 ? 1 : 2; if(rng() < .07) sc.c[i] = 0;
  }

  for(let j=0;j<plumeN;j++,i++){
    R.kind[i] = 4; R.p[i] = rng(); R.q[i] = rng(); R.v[i] = (30 + rng()*40)/(W*1.25);
    R.w[i] = rng() < .62 ? -1 : 1; R.f[i] = 5.5 + rng()*6; R.e[i] = .5 + rng()*.8;
    R.a0[i] = .22 + .45*Math.pow(rng(), 1.2); R.ink[i] = .7 + .3*rng();
    sc.a[i] = 0; sc.s[i] = .6 + rng()*.7; sc.r[i] = 1; sc.z[i] = .22;
    sc.c[i] = rng() < .3 ? 1 : 2; if(rng() < .05) sc.c[i] = 0;

    for(let q=0;q<n;q++){ const v = m.d[q]; acc += v > .05 ? Math.pow(v, 1.45) : 0; cdf[q] = acc; }

    }

  for(let j=0;j<ripN;j++,i++){
    R.kind[i] = 2; R.p[i] = (j%3); R.q[i] = rng()*6.2832; R.v[i] = rng()*2 - 1; R.a0[i] = .3 + rng()*.35; R.ink[i] = .45;
    sc.a[i] = 0; sc.s[i] = .7 + rng()*.4; sc.r[i] = 1; sc.z[i] = .4; sc.c[i] = 1;
  }
  for(;i<N;i++){ R.kind[i] = 3; sc.x[i]=rng()*W; sc.y[i]=rng()*H; sc.a[i]=.04+rng()*.06; sc.s[i]=.7+rng()*.5; sc.r[i]=1; sc.z[i]=.05; sc.c[i]=2; }

// the river is alive: the current surges and curls, plumes billow and fade, the boat rides the swell, the rings spread.
// a grain that wraps around (off the edge, or at the end of a plume's life) is flagged so the sand layer drops it in place
function updateRiver(sc, T){
  const R = sc.river, span = W*1.25, mg = W*.125, X = sc.x, Y = sc.y, A = sc.a, kd = R.kind;
  const Tg = T + 1.6*Math.sin(T*.23);
  buildFlowGrid(T*.9);
  const bx = R.cx + Math.sin(T*.19)*W*.035;
  const slope = (riverY(bx + 6, T) - riverY(bx - 6, T))/12;
  const th = Math.atan(slope)*.7 + Math.sin(T*.8)*.012, ct = Math.cos(th), sn = Math.sin(th);
  const by = R.cy + riverY(bx, T) + Math.sin(T*1.1)*H*.0035 - R.bh*.14;
  const rcx = bx - R.bw*.02, rcy = R.cy + riverY(bx, T) + R.bh*.18;
  for(let i=0;i<N;i++){
    const t = kd[i];
    if(t === 0){
      const raw = R.p[i] + Tg*R.v[i], cyc = Math.floor(raw);
      if(cyc !== R.cyc[i]){ R.cyc[i] = cyc; R.snap[i] = 1; }
      let x = (raw - cyc)*span - mg;
      let y = R.cy + R.q[i] + riverY(x + R.w[i]*140, T)*R.f[i];
      const E = R.e[i];
      flowS(x, y); const hx = x + FVX*E*1.4, hy = y + (FVY + .35)*E;
      flowS(hx, hy); X[i] = hx + FVX*E*1.4; Y[i] = hy + (FVY + .35)*E;
      A[i] = R.a0[i]*clamp01((x + mg)/mg)*clamp01((W + mg - x)/mg);
    } else if(t === 4){
      const L = R.f[i], lt = T/L + R.q[i], cyc = Math.floor(lt), ph = lt - cyc;
      if(cyc !== R.cyc[i]){ R.cyc[i] = cyc; R.snap[i] = 1; R.p[i] = (R.p[i] + .618)%1; }
      const x0 = ((R.p[i] + Tg*R.v[i])%1)*span - mg;
      let x = x0, y = R.cy + riverY(x0, T) + R.w[i]*(H*.02 + ph*H*.13*R.e[i]);
      const E = H*(.01 + .06*ph)*R.e[i];
      flowS(x, y); const hx = x + FVX*E, hy = y + (FVY + .35)*E;
      flowS(hx, hy); X[i] = hx + FVX*E; Y[i] = hy + (FVY + .35)*E;
      A[i] = R.a0[i]*Math.pow(Math.sin(Math.PI*ph), 1.3)*clamp01((x0 + mg)/mg)*clamp01((W + mg - x0)/mg);
    } else if(t === 1){
      const dx = R.p[i], dy = R.q[i];
      X[i] = bx + dx*ct - dy*sn; Y[i] = by + dx*sn + dy*ct;
    } else if(t === 2){
      const lt = T*.17 + R.p[i]/3, cyc = Math.floor(lt), ph = lt - cyc;
      if(cyc !== R.cyc[i]){ R.cyc[i] = cyc; R.snap[i] = 1; }
      const rx = 26 + ph*R.bw*.6 + R.v[i]*5, ry = rx*.15;
      X[i] = rcx + Math.cos(R.q[i])*rx; Y[i] = rcy + Math.sin(R.q[i])*ry;
      A[i] = R.a0[i]*Math.sin(Math.PI*ph)*(1 - ph*.6);
    }
  }
}

// ---------- Text ----------
const off = document.createElement("canvas");
const og = off.getContext("2d", {willReadFrequently:true});
function wrap(g, text, maxW){
  const spaced = text.includes(" ");
  const units = spaced ? text.split(" ") : Array.from(text);
  const lines = []; let cur = "";
  for(const u of units){
    const test = cur ? cur + (spaced?" ":"") + u : u;
    if(g.measureText(test).width > maxW && cur){ lines.push(cur); cur = u; } else cur = test;
  }
  if(cur) lines.push(cur);
  return lines;
}
function sample(step){
  const d = og.getImageData(0,0,W,H).data, pts = [];
  for(let y=0;y<H;y+=step) for(let x=0;x<W;x+=step) if(d[(y*W+x)*4+3] > 110) pts.push(x, y);
  return pts;
}
// composed endings: each item is drawn, sampled, and given a group so it settles in turn
function buildComp(items, seed, lang){
  const rng = mulberry32(seed*97 + (lang==="zh"?3:1));
  off.width = W; off.height = H;
  const pts = items.map(it=>{ og.clearRect(0,0,W,H); og.save(); og.fillStyle = "#000"; it.draw(og); og.restore(); return sample(1); });
  const G = Math.max(...items.map(it=>it.group)) + 1;
  const textN = Math.floor(N*.8);
  const totW = pts.reduce((a,p,k)=>a + (p.length/2)*(items[k].weight||1), 0) || 1;
  const sc = newScene(); sc.d = new Float32Array(N);
  let i = 0;
  items.forEach((it,k)=>{
    const n = pts[k].length/2; if(!n) return;
    const cnt = Math.min(n, Math.round(textN*n*(it.weight||1)/totW), N - i);
    const idx = shuffle(Array.from({length:n},(_,q)=>q), rng);
    for(let q=0;q<cnt;q++){
      const o = idx[q]*2;
      sc.x[i]=pts[k][o]+(rng()-.5)*.9; sc.y[i]=pts[k][o+1]+(rng()-.5)*.9;
      sc.a[i]=it.alpha*(.72+rng()*.28); sc.s[i]=it.size*(.85+rng()*.3); sc.r[i]=1+rng()*.3; sc.z[i]=0; sc.c[i]=it.tone;
      sc.d[i]=(G>1 ? it.group/(G-1) : 0)*.86 + rng()*.14;
      i++;
    }
  });
  for(;i<N;i++){
    const band = rng() < .7;
    sc.x[i]=rng()*W; sc.y[i]= band ? H*(.82 + Math.pow(rng(),.6)*.2) : rng()*H;
    sc.a[i]= band ? .04+rng()*.07 : .02+rng()*.04; sc.s[i]=.7+rng()*.7; sc.r[i]=1+rng()*.5; sc.z[i]=band?.2:.05; sc.c[i]=2; sc.d[i]=rng();
  }
  shuffleScene(sc, rng);
  return sc;
}
function quoteItems(lang){
  const E = ENDC[lang], zh = lang==="zh", lines = E.q;
  const fam = zh ? '"Noto Serif TC",serif' : '"Cormorant Garamond",Garamond,serif';
  const style = zh ? "600" : "italic 500";
  let fs = zh ? Math.min(Math.max(W*.034, 18), H*.05, 34) : Math.min(Math.max(W*.034, 19), H*.052, 38);
  og.font = `${style} ${fs}px ${fam}`;
  if(zh) og.letterSpacing = "0.32em";
  const widest = Math.max(...lines.map(t=>og.measureText(t).width));
  if(widest > W - 48){ fs *= (W - 48)/widest; }
  og.letterSpacing = "0px";
  const lh = fs*1.7, y0 = H*.44 - (lines.length-1)*lh/2;
  const items = lines.map((t,k)=>({group:k, alpha:.95, size:1.15, tone:0, draw:g=>{
    g.font = `${style} ${fs}px ${fam}`; g.textAlign = "center"; g.textBaseline = "middle";
    if(zh) g.letterSpacing = "0.32em";
    g.fillText(t, W/2 + (zh ? fs*.16 : 0), y0 + k*lh);
  }}));
  items.push({group:lines.length, alpha:.75, size:1, tone:1, draw:g=>{
    g.font = `500 ${Math.max(15, fs*.5)}px ${fam}`; g.textAlign = "center"; g.textBaseline = "middle";
    if(zh) g.letterSpacing = "0.2em";
    g.fillText(E.src, W/2, y0 + (lines.length-1)*lh + fs*1.6);

}
function linkLayout(){

function cam(scene, u){

// a brush drawn through still water leaves two eddies turning against each other in its wake;
// they drift on with the brush's momentum, ride the current, spread and slowly fade
const VOR = [];
let sLX = null, sLY = 0, sLT = 0, sLast = 0, BRUSH = 0;
function stirAt(x, y, t, k){
  if(reduce) return;
  if(sLX === null || t - sLT > 160){ sLX = x; sLY = y; sLT = t; return; }
  const dx = x - sLX, dy = y - sLY, d = Math.hypot(dx, dy), dtm = Math.max(8, t - sLT);
  if(d < 7) return;
  const speed = d/dtm;

  if(t - sLast > 42){
    sLast = t;
    const nx = -dy/d, ny = dx/d, g = Math.min(1.7, .35 + speed*.8)*k, r = 22 + Math.min(26, d*.4), off = r*.55;
    const vx = dx/dtm*1000*.16, vy = dy/dtm*1000*.16;

    VOR.push({x:x + nx*off, y:y + ny*off, vx, vy, g, r}, {x:x - nx*off, y:y - ny*off, vx, vy, g:-g, r});
  }

}
function stepVortices(dt){
  for(let j=VOR.length-1; j>=0; j--){
    const v = VOR[j], dm = Math.exp(-dt*1.5);

    v.vx *= dm; v.vy *= dm;
    v.r += dt*12; v.g *= Math.exp(-dt*.5);

  let br = 0; for(let i=0;i<nd.length;i++){ br = (br + .02*(Math.random()*2-1))/1.02; nd[i] = br*3.2; }

  windGain = AC.createGain(); windGain.gain.value = 0;

  src.start();

  waterFilter = AC.createBiquadFilter(); waterFilter.type = "bandpass"; waterFilter.frequency.value = 700; waterFilter.Q.value = 1.1;

  const vNow = (sp - lastSp)/dtv; lastSp = sp;
  velS += (vNow - velS)*Math.min(1, dt*6);
  const pushT = reduce ? 0 : Math.min(.3, Math.abs(velS)*.22);
  pushS += (pushT - pushS)*Math.min(1, dt*3.5);
  PUSH = pushS;
  // moving through the scroll stirs the water; when you stop it slowly goes still again
  STIR += ((reduce ? 0 : Math.min(1.4, Math.abs(velS)*.8)) - STIR)*Math.min(1, dt*(Math.abs(velS)*.8 > STIR ? 3 : .9));
  FT += dt*(1 + STIR*1.6);
  TILTX += (tgX - TILTX)*Math.min(1, dt*1.4); TILTY += (tgY - TILTY)*Math.min(1, dt*1.4);

  const hasPtr = mx > -1e4;
  const tmx = hasPtr ? mx/W - .5 : 0, tmy = hasPtr ? my/H - .5 : 0;
  mxs += (tmx - mxs)*Math.min(1, dt*2.5); mys += (tmy - mys)*Math.min(1, dt*2.5);
  if(k === 0 || k === S-2) updateRiver(sets.en[0], reduce ? 0 : FT);
  const cA = cam(SCENES[k], sp - k), cB = cam(SCENES[k+1], sp - (k+1));

  // the opening gathers on its own, and scrolling draws the grain together sooner
  introP = Math.min(1, introP + dt/(reduce ? .6 : 5.2) + (reduce ? 0 : Math.min(2.5, scrollVel)*dt*.9));
  const introT = introP;
  const lt = lang==="zh" ? 1 : 0;
  if(langMix !== lt){
    const step = dt/(reduce?.3:1.8);
    langMix = lt > langMix ? Math.min(lt, langMix+step) : Math.max(lt, langMix-step);
  }
  if(langMix <= 0 || langMix >= 1){
    computeInto(sets[langMix>=1?"zh":"en"], k, t, P, cA, cB, FT);
  } else {
    computeInto(sets.en, k, t, P, cA, cB, FT);
    computeInto(sets.zh, k, t, Q, cA, cB, FT);
    for(let i=0;i<N;i++){
      const dx = Q.x[i]-P.x[i], dy = Q.y[i]-P.y[i];
      const ll = clamp01((langMix - DR[i]*.4)/.6), e = ease(ll);
      const sn = Math.sin(Math.PI*ll)*clamp01(Math.hypot(dx,dy)/40), lift = sn*L*.7*MG[i];
      const x = P.x[i] + dx*e, y = P.y[i] + dy*e;
      flow(x,y,FT);
      P.x[i] = x + (FVX*.7 + LX[i]*.3)*lift;
      P.y[i] = y + (FVY*.7 + LY[i]*.3)*lift;
      P.a[i] += (Q.a[i]-P.a[i])*e; P.s[i] += (Q.s[i]-P.s[i])*e; P.r[i] += (Q.r[i]-P.r[i])*e;
      if(e>.5) P.c[i] = Q.c[i];
      if(sn > P.m[i]) P.m[i] = sn;
    }
  }

  ctx.clearRect(0,0,W,H);
  const iE = ease(introT);

  // the painting itself, faint: a soft bloom first, the brushwork once the grain has settled
  const drawWash = (w, wt, c) => {
    if(!w || wt<=.002) return;
    const z = w.flat ? 0 : .55, sc = 1 + c.ds*z;
    const x = c.ax + (w.pl.x0 - c.ax)*sc + c.dx*z, y = c.ay + (w.pl.y0 - c.ay)*sc + c.dy*z;
    if(w.sharp){
      ctx.globalAlpha = Math.pow(wt*iE, 2.2);
      ctx.drawImage(w.m.crisp, x, y, w.pl.sw*sc, w.pl.sh*sc);
    } else {
      ctx.globalAlpha = Math.pow(wt*iE, 1.1)*.62;
      ctx.drawImage(w.m.soft, x, y, w.pl.sw*sc, w.pl.sh*sc);
      ctx.globalAlpha = Math.pow(wt*iE, 1.6)*.7;
      ctx.drawImage(w.m.crisp, x, y, w.pl.sw*sc, w.pl.sh*sc);
    }
  };
  drawWash(washes[k], 1-t, cA); drawWash(washes[k+1], t, cB);

  // as a painting comes to rest the ink is still wet: it darkens, and a soft edge creeps out into the paper, then dries
  const nr = Math.round(sp);
  if(Math.abs(sp - nr) < .015 && Math.abs(spV) < .12 && introT > .9){
    if(landed !== nr){ landed = nr; if(washes[nr] && !reduce){ bleedK = nr; bleedT = 0; landSound(); } }
  } else if(Math.abs(sp - nr) > .3) landed = -1;
  bleedT += dt;
  if(bleedK >= 0 && bleedT < 4){
    const w = washes[bleedK], c = bleedK === k ? cA : bleedK === k+1 ? cB : null;
    if(w && c){
      const vis = bleedK === k ? 1-t : t;
      const wet = smooth(0, .45, bleedT)*(1 - smooth(.5, 4, bleedT))*vis, spread = 1 - Math.exp(-bleedT*1.1);
      const z = w.flat ? 0 : .55, sc = 1 + c.ds*z;
      const x = c.ax + (w.pl.x0 - c.ax)*sc + c.dx*z, y = c.ay + (w.pl.y0 - c.ay)*sc + c.dy*z;
      const ww = w.pl.sw*sc, hh = w.pl.sh*sc, cx = x + ww/2, cy = y + hh/2;
      const BA = [.2, .12, .07], BS = [.006, .018, .034];
      for(let j=0;j<3;j++){
        const g = 1 + BS[j]*spread;
        ctx.globalAlpha = wet*BA[j];
        ctx.drawImage(w.m.soft, cx - ww*g/2, cy - hh*g/2, ww*g, hh*g);
      }
      ctx.globalAlpha = wet*.16;
      ctx.drawImage(w.m.crisp, x, y, ww, hh);
      ctx.globalAlpha = 1;
    }
  }

  stepVortices(dt);
  const nV = VOR.length;
  const nSub = dt > .025 ? 2 : 1, hSub = dt/nSub;
  // how much of the river is on screen: it fades out as the first painting gathers, and back in at the loop
  const RV0 = sets.en[0] && sets.en[0].river, RW = !RV0 ? 0 : k === 0 ? 1 - t : k === S-2 ? t : 0;
  const RINK = RV0 ? RV0.ink : null, RS = RW > 0 && RV0 ? RV0.snap : null;
  const R = W<700 ? 70 : 110, R2 = R*R;
  for(let i=0;i<N;i++){
    let x = P.x[i], y = P.y[i], a = P.a[i], m = P.m[i];
    if(RW > 0){ const rm = RINK[i]*RW; if(rm > m) m = rm; }
    if(introT < 1){
      const il = clamp01((introT - DR[i]*.5)/.5), e = ease(il), sn = Math.sin(Math.PI*il), lift = sn*L*.55*MG[i];
      const bx = SX[i] + (x-SX[i])*e, by = SY[i] + (y-SY[i])*e;
      flow(bx,by,FT);
      const hx = bx + (FVX*.8 + LX[i]*.2)*lift*.5, hy = by + (FVY*.8 + LY[i]*.2)*lift*.5;
      flow(hx,hy,FT);
      x = hx + (FVX*.86 + LX[i]*.14)*lift*.5;
      y = hy + (FVY*.86 + LY[i]*.14)*lift*.5;
      a = .06 + (a-.06)*e;
      if(sn > m) m = sn;
      if(il < .02) m = 1;
    }
    if(!reduce){
      const amp = (.3 + (1 - Math.min(1, a*2.5))*3.4)*(1 + STIR*1.1);
      flow(x,y,FT);
      x += Math.sin(T*.4 + PH[i])*amp + FVX*amp*.7;
      y += Math.cos(T*.29 + PH[i]*1.7)*amp*.7 + FVY*amp*.35;
      // sand: every grain has its own weight and chases where it should be on its own spring,
      // so light grains stream ahead, heavy ones lag, they sway past and settle; fast grains spray and leave ink
      if(snapG || (RS && RS[i])){ GX[i] = x; GY[i] = y; GVX[i] = 0; GVY[i] = 0; PXp[i] = x; PYp[i] = y; }
      const kf = KF[i], kc = KC[i];
      let gvx = GVX[i], gvy = GVY[i], gx = GX[i], gy = GY[i];
      for(let j=0;j<nSub;j++){
        gvx += ((x - gx)*kf - gvx*kc)*hSub; gvy += ((y - gy)*kf - gvy*kc)*hSub;
        gx += gvx*hSub; gy += gvy*hSub;
      }
      GVX[i] = gvx; GVY[i] = gvy; GX[i] = gx; GY[i] = gy;
      const spd = Math.abs(gvx) + Math.abs(gvy);
      x = gx; y = gy;
      if(spd > 30){
        const sp2 = Math.min(1, (spd - 30)/500);
        x += Math.sin(PH[i]*31 + T*9)*sp2*3.2; y += Math.cos(PH[i]*23 + T*8)*sp2*3.2;
        m = Math.max(m, sp2*.85);
      }
    }
    let vx = VX[i], vy = VY[i];
    if(hasPtr){
      const dx = x + OX[i] - mx, dy = y + OY[i] - my, d2 = dx*dx + dy*dy;
      if(d2 < R2 && d2 > .01){
        const d = Math.sqrt(d2), f2 = (1 - d/R), fs = f2*f2*(reduce?.6:1.5)*(1 - RW*.7);
        vx += (dx/d)*fs + (-dy/d)*fs*.9 + .2*f2;
        vy += (dy/d)*fs + (dx/d)*fs*.9 - .4*f2;
      }
    }
    if(nV){
      const gx = x + OX[i], gy = y + OY[i];
      for(let j=0;j<nV;j++){
        const v = VOR[j], dx = gx - v.x, dy = gy - v.y, d2 = dx*dx + dy*dy, R2 = v.r*v.r*9;
        if(d2 >= R2) continue;
        const f = v.g*.22*v.r/(d2 + v.r*v.r)*(1 - d2/R2);
        vx += -dy*f; vy += dx*f;
      }
    }
    vx = (vx - OX[i]*.011)*.935; vy = (vy - OY[i]*.011)*.935;
    VX[i]=vx; VY[i]=vy; OX[i]+=vx; OY[i]+=vy;
    const disp = Math.abs(OX[i]) + Math.abs(OY[i]);
    if(disp > .5){ x += OX[i]; y += OY[i]; m = Math.max(m, Math.min(1, disp/45)); }
    FX[i]=x; FY[i]=y; FA[i]=a>1?1:a; FM[i]=m;
  }

  if(RV0) RV0.snap.fill(0);

  // ink in water: moving grain is laid into a half-resolution buffer that slowly clears, leaving soft plumes
  if(!reduce){
    if(!dif || dif.width !== ink.width || dif.height !== ink.height){ dif = document.createElement("canvas"); dif.width = ink.width; dif.height = ink.height; dctx = dif.getContext("2d"); }
    dctx.clearRect(0,0,dif.width,dif.height);
    dctx.globalAlpha = .3; dctx.drawImage(ink, 0, 0);
    dctx.globalAlpha = .27; dctx.drawImage(ink, -.6, -.3); dctx.drawImage(ink, .6, -.3); dctx.drawImage(ink, 0, -.75);
    ictx.clearRect(0,0,ink.width,ink.height);
    ictx.globalAlpha = 1; ictx.drawImage(dif, 0, 0);
  }
  ictx.globalCompositeOperation = "destination-out";
  ictx.globalAlpha = 1; ictx.fillStyle = "rgba(0,0,0,.06)";
  ictx.fillRect(0,0,ink.width,ink.height);
  ictx.globalCompositeOperation = "source-over";
  ictx.fillStyle = "#34332F";
  for(let i=0;i<N;i++){
    const m = FM[i]; if(m < .04) continue;
    const a = FA[i]*m*.2; if(a < .004) continue;
    const s = P.s[i]*(1 + 2.6*m)*.5;
    ictx.globalAlpha = a*.7;
    ictx.fillRect(FX[i]*.5 - s*.5, FY[i]*.5 - s*.5, s, s);
  }
  if(!reduce && !trailSkip){
    const th = [new Path2D(), new Path2D(), new Path2D()];
    for(let i=0;i<N;i++){
      const m = FM[i]; if(m < .08 || FA[i] < .05) continue;
      const x1 = FX[i]*.5, y1 = FY[i]*.5;
      let dx = x1 - PXp[i]*.5, dy = y1 - PYp[i]*.5;
      const d2 = dx*dx + dy*dy;
      if(d2 < .09 || d2 > 900) continue;
      // a thread is only ever a short, soft stroke behind the grain, however far it moved this frame
      if(d2 > 16){ const k2 = 4/Math.sqrt(d2); dx *= k2; dy *= k2; }
      const x0 = x1 - dx, y0 = y1 - dy;
      // dry brush: charcoal skips over the tooth of the paper, so each thread breaks and catches
      if(Math.sin(PH[i]*7.3 + (x1 + y1)*.21 + FT*2.2) > .45) continue;
      const b = m < .35 ? 0 : m < .7 ? 1 : 2;
      th[b].moveTo(x0, y0); th[b].lineTo(x1, y1);
    }
    ictx.strokeStyle = "#2A2926"; ictx.lineCap = "butt";
    const TA = [.05, .085, .12], TW = [.55, .8, 1.05];
    for(let b=0;b<3;b++){ ictx.globalAlpha = TA[b]; ictx.lineWidth = TW[b]; ictx.stroke(th[b]); }
  }
  PXp.set(FX); PYp.set(FY); trailSkip = false; snapG = false;
  ctx.globalAlpha = .8;
  ctx.drawImage(ink, 0, 0, W, H);

  for(let tone=0; tone<3; tone++){
    ctx.fillStyle = TONES[tone];
    for(let i=0;i<N;i++){
      if(P.c[i]!==tone) continue;
      const a = FA[i]*(1 - .6*FM[i]); if(a < .01) continue;
      ctx.globalAlpha = a;
      const s = P.s[i];
      ctx.fillRect(FX[i], FY[i], s, s*P.r[i]);
    }
  }
  ctx.globalAlpha = 1;

  hintEl.style.opacity = String(Math.max(0, 1 - sp*5) * iE);
  audioFrame(now);
  drawCorner(T, dt);
  const endO = 0;
  for(const [hitEl, key] of HITS){
    const idx = SCENES.findIndex(q=>q.key===key), live = Math.abs(sp - idx) < .12;
    if(live !== (hitEl.dataset.live === "1")){
      hitEl.dataset.live = live ? "1" : "0";
      hitEl.style.pointerEvents = live ? "auto" : "none"; hitEl.tabIndex = live ? 0 : -1;
      if(live){
        const sc2 = sets[lang][idx], a = sc2.titleBox, b = sc2.ctaBox || a;
        const x0 = Math.min(a.x, b.x), y0 = a.y, x1 = Math.max(a.x + a.w, b.x + b.w), y1 = b.y + b.h;
        Object.assign(hitEl.style, {left:x0+"px", top:y0+"px", width:(x1-x0)+"px", height:(y1-y0)+"px", margin:"0"});
      }
    }
  }
  const linksLive = Math.abs(sp - (S-2)) < .12;
  if(linksLive !== (mailHit.dataset.live === "1")){
    mailHit.dataset.live = linksLive ? "1" : "0";
    mailHit.style.pointerEvents = linksLive ? "auto" : "none"; mailHit.tabIndex = linksLive ? 0 : -1;
  }
  if(linksLive !== (stonesEl.dataset.live === "1")){
    stonesEl.dataset.live = linksLive ? "1" : "0";
    for(const a of stonesEl.children){ a.style.pointerEvents = linksLive ? "auto" : "none"; a.tabIndex = linksLive ? 0 : -1; }
  }

  const near = Math.min(S-1, Math.round(sp)), sc = SCENES[near];
  if(near !== plateScene){
    plateScene = near;
    if(sc.type==="art"){
      distEl.textContent = sc.label;
      creditEl.textContent = sc.credit[lang] + (lang==="zh" ? "　" : ". ") + MUSEUM[lang];
      creditEl.lang = lang==="zh" ? "zh-Hant" : "en";
    }
  }
  const pO = sc.type==="art" ? (1 - Math.min(1, Math.abs(sp-near)*3.2))*iE*(near===S-1 ? 1-endO*.0 : 1) : 0;
  plateEl.style.opacity = String(pO*.9);
  if(sc.type==="art"){
    const opt = sc.pl ? {side: sc.pl.side, free: sc.pl.free} : null;
    ensureLabel("credit", sc.credit[lang] + (lang==="zh" ? "　" : ". ") + MUSEUM[lang], opt);
    ensureLabel("dist", sc.label, opt);
  }
  ensureLabel("hint", hintText(lang));
  const hintA = Math.max(0, 1 - sp*5) * iE;
  UI.hint.ta = hintA * (.82 + .13*Math.sin(T*2.1));
  if(UI.credit) UI.credit.ta = pO*.92*(1 - hintA);
  if(UI.dist) UI.dist.ta = pO*.85*(1 - hintA);
  drawUI(T, dt);
  drawCue(T, hintA);
}
// above the word: a hairline of grain with a bead of ink that slips down it, again and again
function drawCue(T, a){
  if(a < .01) return;
  const x = W/2, y1 = H - 66 - 28 - 6, y0 = y1 - 46, ph = reduce ? .5 : (T*.55)%1;
  uctx.fillStyle = "#262624";
  for(let j=0;j<46;j++){
    const t = j/45, d = (t - ph)/.1, bead = Math.exp(-d*d), y = y0 + t*(y1 - y0);
    for(let q=0;q<3;q++){
      const jx = Math.sin(j*12.9 + q*78.2)*(.9 + bead*1.6);
      uctx.globalAlpha = a*(.1 + bead*.75)*(q===0 ? 1 : .55);
      uctx.fillRect(x + jx, y + Math.sin(j*3.1 + q)*.3, .9, .9 + bead*.8);
    }
  }
  uctx.globalAlpha = 1;
}

function makeGrain(){
  const c = document.createElement("canvas"); c.width = c.height = 240;
  const g = c.getContext("2d"), img = g.createImageData(240,240), d = img.data;
  for(let i=0;i<d.length;i+=4){
    const v = 140 + Math.random()*115;
    d[i]=v; d[i+1]=v*.99; d[i+2]=v*.965; d[i+3]=Math.random()<.5 ? 30 : 12;
  }
  g.putImageData(img,0,0);
  g.lineWidth = .6;
  for(let k=0;k<30;k++){
    g.strokeStyle = `rgba(60,58,52,${.05+Math.random()*.08})`;
    const x=Math.random()*240, y=Math.random()*240, a=(Math.random()-.5)*.5;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*34, y+Math.sin(a)*34); g.stroke();
  }
  document.getElementById("grain").style.backgroundImage = `url(${c.toDataURL()})`;
}

setLang(lang);
makeGrain();
const fontsReady = Promise.all([
  document.fonts.load('600 60px "Cormorant Garamond"'),
  document.fonts.load('italic 500 30px "Cormorant Garamond"'),
  document.fonts.load('italic 600 18px "Cormorant Garamond"'),
  document.fonts.load('500 20px "Cormorant Garamond"'),
  document.fonts.load('600 60px "Noto Serif TC"', hanChars),
  document.fonts.load('500 20px "Noto Serif TC"', hanChars),
]).catch(()=>{});
Promise.all([
  Promise.race([fontsReady, new Promise(r=>setTimeout(r,2500))]),
  loadMaps()
]).then(()=>{
  build();
  requestAnimationFrame(frame);
  if(location.hash === "#read") setReading(true);
});
})();
</script>
